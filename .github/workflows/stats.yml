name: Collect store stats

on:
  schedule:
    # once a day; the numbers move slowly and Google dislikes being polled
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect
        run: python3 scripts/collect_stats.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- stats.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.json
          git commit -m 'Update store stats'
          git push
