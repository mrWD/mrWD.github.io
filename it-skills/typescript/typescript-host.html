<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TypeScript</title>
  </head>
  <body>
    <!--
      A phone's TypeScript compiler. It is 9 MB of JavaScript that takes seconds to start, too
      much for the app's own thread, so the app keeps this page in a hidden WebView, loaded from
      the app bundle with the compiler and its libraries beside it: checks work offline.
      The app calls window.typescriptRun({ id, mode, files, … }); the page answers through
      ReactNativeWebView.postMessage with { type: 'ready' | 'failed' | 'loading' | 'loaded' | 'result', … }.
      What a check does is checker.js, the same file the browser's worker and Node load.
    -->
    <script>
      // What goes wrong in the page reaches the app's log: a WebView has no console to read.
      function report(message) {
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'log', message: String(message) }));
      }
      window.addEventListener(
        'error',
        function (e) {
          report('error: ' + (e.message || (e.target && (e.target.src || e.target.href)) || e));
        },
        true,
      );
      window.addEventListener('unhandledrejection', function (e) {
        report('rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
      });

      // A WebView refuses fetch() on file:// pages: the libraries are read through XMLHttpRequest.
      function read(name) {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', new URL(name, location.href).href);
          xhr.onload = function () {
            resolve(xhr.responseText);
          };
          xhr.onerror = function () {
            report('cannot load ' + name);
            reject(new Error('Cannot load ' + name));
          };
          xhr.send();
        });
      }
    </script>
    <script src="typescript.js"></script>
    <script src="checker.js"></script>
    <script>
      (function () {
        function post(message) {
          window.ReactNativeWebView.postMessage(JSON.stringify(message));
        }
        var checker = read('lib.json').then(function (text) {
          return TypeScriptChecker.create(ts, JSON.parse(text), {
            // The first check parses the libraries: seconds, and not the check's own time.
            loading: function (request) {
              post({ type: 'loading', id: request.id });
            },
            loaded: function (request) {
              post({ type: 'loaded', id: request.id });
            },
          });
        });
        checker.then(
          function () {
            post({ type: 'ready' });
          },
          function (e) {
            post({ type: 'failed', error: String(e) });
          },
        );
        window.typescriptRun = function (request) {
          checker.then(
            function (c) {
              post(Object.assign({}, c.run(request), { type: 'result', id: request.id }));
            },
            function (e) {
              post({ type: 'result', id: request.id, error: String(e) });
            },
          );
        };
      })();
    </script>
  </body>
</html>
