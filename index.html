<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Viktor Lavrov — Products</title>
  <meta name="description" content="Apps and browser extensions built by Viktor Lavrov — local-first, privacy-friendly, mostly open source." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Viktor Lavrov — Products" />
  <meta property="og:description" content="Apps and browser extensions built by Viktor Lavrov — local-first, privacy-friendly, mostly open source." />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>" />
  <link rel="preconnect" href="https://docs.google.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap">
      <div class="header-top">
        <a class="brand" href="./">
          <span class="brand-mark">VL</span>
          <span class="brand-text">Viktor Lavrov</span>
        </a>

        <nav class="header-links">
          <a href="https://github.com/mrWD" target="_blank" rel="noopener">GitHub</a>
          <a href="https://www.linkedin.com/in/viktor-lavrov" target="_blank" rel="noopener">LinkedIn</a>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle colour theme">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="icon-moon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/><g class="icon-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></g></svg>
          </button>
        </nav>
      </div>

      <h1 class="title">Things I build</h1>
      <p class="subtitle">
        Small, focused apps and browser extensions. Local-first where possible,
        no accounts, no tracking — and most of them are open source.
      </p>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar" aria-label="Filter projects">
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        <input id="search" type="search" placeholder="Search projects…" autocomplete="off" aria-label="Search projects" />
        <kbd>/</kbd>
      </div>
      <div id="filters" class="filters" role="group" aria-label="Categories"></div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="grid" class="grid" aria-busy="true">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>

    <p id="empty" class="empty" hidden>Nothing matches that search.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Have an idea or found a bug? <a href="https://github.com/mrWD" target="_blank" rel="noopener">Ping me on GitHub</a>.</p>
    </div>
  </footer>

  <template id="card-template">
    <article class="card">
      <div class="card-head">
        <span class="card-icon" aria-hidden="true"></span>
        <span class="badge" hidden></span>
      </div>
      <h2 class="card-title"></h2>
      <p class="card-tagline"></p>
      <p class="card-desc"></p>
      <ul class="tags"></ul>
      <div class="card-links"></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
